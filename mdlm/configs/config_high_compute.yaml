# High Compute Configuration - Optimized for maximum performance
# Copy this to your config.yaml or override specific values

defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: openwebtext
  - /model: medium  # Changed from small
  - /strategy: ddp
  - /noise: loglinear
  - /lr_scheduler: cosine_decay_warmup  # Changed from constant_warmup

mode: train
diffusion: absorbing_state
backbone: dit
parameterization: subs
time_conditioning: True  # IMPORTANT: Enable time conditioning for better quality
T: 0  # Continuous time
subs_masking: False

seed: 1

loader:
  global_batch_size: 2048  # Increased from 512 (4x larger)
  eval_global_batch_size: ${.global_batch_size}
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ddpm_cache  # or 'analytic' for potentially better quality
  steps: 256  # Increased from 128 (2x more steps for better quality)
  noise_removal: True
  num_sample_batches: 2
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False  # Can set to True for better timestep sampling
  sampling_eps: 1e-3
  change_of_variables: False

eval:
  checkpoint_path: ''
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large
  generate_samples: True
  sample_from_train: False
  batch_index: null
  sample_index_in_batch: null
  coordinate_file: null

optim:
  weight_decay: 0.01  # Added regularization (was 0)
  lr: 6e-4  # Scaled up from 3e-4 (2x batch size -> 2x LR is a good starting point)
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 2_000_000  # Increased from 1_000_000
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  check_val_every_n_epoch: 1  # Validate every epoch (was 10)

wandb:
  project: text-diffusion
  notes: High compute optimized config
  group: null
  job_type: null
  name: null
  id: ${.name}_${seed}
  tags:
    - ${noise.type}
    - ${data.train}
    - ${data.valid}
    - high_compute

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  save_dir: ${cwd:}
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt

